<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<meta name="theme-color" content="#FAF8F4">
<title data-i18n="app.doctitle">机枢 · Mainspring</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#FAF8F4; --surface:#FFFFFF; --ink:#1A1A1A; --ink-2:#6E6961; --ink-3:#9E998F;
  --hair:rgba(26,26,26,.16); --hair-2:rgba(26,26,26,.08);
  --accent:#E4631A; --danger:#A3231C;
  --serif:Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
body{background:var(--paper);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:0 48px 80px}

/* ---------- 页头 ---------- */
.masthead{padding:52px 0 0;text-align:center;border-bottom:1px solid var(--hair)}
.brand{font-size:21px;font-weight:400;letter-spacing:.52em;text-indent:.52em}
.sub{margin-top:13px;font-size:10.5px;letter-spacing:.32em;text-indent:.32em;color:var(--ink-3)}
.tabs{margin-top:30px;display:flex;justify-content:center;gap:0}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 24px 13px;
  font:inherit;font-size:12px;letter-spacing:.3em;text-indent:.3em;color:var(--ink-3);cursor:pointer;transition:color .18s var(--ease)}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0 22px;font-size:11px;letter-spacing:.14em;color:var(--ink-3)}
.topbar .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink-3);margin-right:7px;vertical-align:1px}
.topbar .dot.live{background:#3B6D11}
.topbar .dot.dead{background:var(--danger)}
.topbar a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid transparent;cursor:pointer}
.topbar a:hover{color:var(--danger);border-bottom-color:var(--danger)}
/* 版本号挪到页面最末（老大 2026-09-20） */
.page-foot{max-width:1240px;margin:0 auto;padding:0 48px 46px;text-align:right;
  font-size:10.5px;letter-spacing:.16em;color:var(--ink-3)}

/* ---------- 统计 ---------- */
.stats{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--hair);margin-bottom:26px}
.st{padding:18px 20px;border-right:1px solid var(--hair-2)}
.st:last-child{border-right:0}
.st .n{font-family:var(--serif);font-size:30px;line-height:1.1;letter-spacing:.01em}
.st .k{margin-top:5px;font-size:10px;letter-spacing:.2em;color:var(--ink-3)}
.st.hot .n{color:var(--accent)}

/* ---------- 工具条 ---------- */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.search{flex:1;min-width:220px;border:0;border-bottom:1px solid var(--ink);background:transparent;
  padding:9px 2px;font:inherit;font-size:13px;letter-spacing:.04em;color:var(--ink);outline:none}
.search:focus{border-bottom-color:var(--accent)}
.search::placeholder{color:var(--ink-3);letter-spacing:.14em;font-size:12px}
.btn{appearance:none;background:var(--surface);border:1px solid var(--ink);color:var(--ink);
  padding:9px 20px;font:inherit;font-size:11.5px;letter-spacing:.2em;text-indent:.2em;cursor:pointer;transition:all .16s var(--ease)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.pri:hover{background:var(--surface);color:var(--ink)}
.btn.gh{background:transparent;border-color:var(--hair);color:var(--ink-2)}
.btn.gh:hover{border-color:var(--danger);color:var(--danger);background:transparent}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:5px 13px;font-size:10.5px;letter-spacing:.14em}

/* ---------- 三栏 ---------- */
/* 🔴 必须 minmax(0,1fr)：1fr 的最小尺寸按内容算，卡片里的 nowrap 长路径会把栏撑歪 */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;align-items:start}
.col > h2{font-size:11px;font-weight:400;letter-spacing:.2em;text-indent:.2em;color:var(--ink-2);
  padding-bottom:11px;border-bottom:1px solid var(--ink);margin-bottom:2px;display:flex;justify-content:space-between}
.col > h2 .c{font-family:var(--serif);font-size:13px;letter-spacing:0}
.list{border-top:1px solid var(--hair-2)}
/* 等级不画左侧色条（老大 2026-09-20：「为什么"高优先级"旁边是红线？好丑，
   原本是把优先级标红立着，那个多好看」）⇒ 回到 v1 做法：让「等级标签」自己实心标色 */
.card{padding:20px 18px;border-bottom:1px solid var(--hair-2);cursor:pointer;transition:background .15s var(--ease)}
.card:hover{background:var(--surface)}
.card .r1{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.code{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;letter-spacing:.08em;color:var(--ink-3)}
.pill{font-size:9.5px;letter-spacing:.14em;padding:2.5px 8px;border:1px solid var(--hair);color:var(--ink-2);white-space:nowrap}
/* 等级标签 = 实心色块（v1 的观感：优先级一眼跳出来） */
.pill.k-红线{background:var(--danger);color:var(--paper);border-color:var(--danger)}
.pill.k-高{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.pill.k-待拍板{border-color:var(--accent);color:var(--accent)}
.pill.k-已点名{border-color:var(--ink);color:var(--ink)}
.pill.k-进行中{border-color:var(--ink);color:var(--ink)}
.card .ttl{font-size:14.5px;font-weight:500;line-height:1.5;letter-spacing:.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .smy{margin-top:11px;font-size:12px;line-height:1.72;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:62px}
.card .loc{margin-top:10px;font-size:11px;letter-spacing:.06em;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:44px 10px;text-align:center;font-size:11px;letter-spacing:.16em;color:var(--ink-3);line-height:2}
/* 「另有 N 条已完成」—— 替代原来那条"验证记录栏不沉底"的特例，既保持列表干净，又不让人误以为空的 */
.more{margin-top:14px;padding:10px 2px;font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);
  border-top:1px solid var(--hair-2);cursor:pointer;text-align:center;transition:color .16s var(--ease)}
.more:hover{color:var(--ink)}

/* ---------- 通用面板 ---------- */
.panel{border:1px solid var(--hair);background:var(--surface)}
.panel + .panel{margin-top:22px}
.panel > h3{font-size:11px;font-weight:400;letter-spacing:.24em;text-indent:.24em;color:var(--ink-2);
  padding:15px 20px;border-bottom:1px solid var(--hair-2)}
/* （details.fold / .gd-h 的样式已随「怎么接」栏目一起删除，2026-09-20） */
.row{display:flex;gap:16px;padding:14px 20px;border-bottom:1px solid var(--hair-2);align-items:flex-start}
.row:last-child{border-bottom:0}
.row:hover{background:var(--paper)}
.row .grow{flex:1;min-width:0}
.row .unread{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;margin-top:7px}
.row .unread.no{background:transparent}
.k{font-size:10px;letter-spacing:.16em;color:var(--ink-3)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;letter-spacing:.02em}

/* ---------- 项目文件夹 ---------- */
.proj{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;border:1px solid var(--hair);min-height:460px}
.proj .side{border-right:1px solid var(--hair);padding:8px 0}
.proj .side .it{padding:11px 20px;cursor:pointer;font-size:12.5px;display:flex;justify-content:space-between;gap:10px;transition:background .15s var(--ease)}
.proj .side .it:hover{background:var(--paper)}
.proj .side .it.on{background:var(--ink);color:var(--paper)}
.proj .side .it.on .k{color:rgba(250,248,244,.6)}
.proj .main{padding:8px 0;overflow:auto;max-height:640px}
.proj .f{padding:11px 22px;cursor:pointer;display:flex;justify-content:space-between;gap:14px;align-items:baseline;
  border-bottom:1px solid var(--hair-2);transition:background .15s var(--ease)}
.proj .f:hover{background:var(--paper)}
.proj .f .nm{font-size:12px;line-height:1.5;word-break:break-all}

/* ---------- Token ---------- */
.tkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.tk{border:1px solid var(--hair);background:var(--surface);padding:20px 22px}
.tk.dead{opacity:.5}
.tk .th{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.tk .nm{font-size:14px}
.tk .val{margin:15px 0 4px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;
  background:var(--paper);border:1px solid var(--hair-2);padding:11px 13px;word-break:break-all;line-height:1.7}
.tk .ha{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tk .st{margin-top:12px;font-size:10.5px;letter-spacing:.12em;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap}
.ok{color:#3B6D11}.bad{color:var(--danger)}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(26,26,26,.42);z-index:40}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:680px;height:84vh;background:var(--paper);
  z-index:41;display:flex;flex-direction:column;border:1px solid var(--ink)}
.dlg.sm{height:auto;width:520px}
.dlg .dh{padding:32px 34px 0;flex:none}
.dlg .dh .r1{display:flex;align-items:center;gap:11px;margin-bottom:15px}
.dlg h2{font-size:19px;font-weight:400;line-height:1.5;letter-spacing:.01em}
.dlg .rule{height:1px;background:var(--ink);margin:22px 0 0;flex:none}
.dlg .meta{display:flex;gap:22px;flex-wrap:wrap;padding:14px 34px;border-bottom:1px solid var(--hair-2);flex:none;
  font-size:10.5px;letter-spacing:.1em;color:var(--ink-3)}
.dlg .meta b{font-weight:400;color:var(--ink-2)}
.dlg .body{flex:1;overflow:auto;padding:22px 34px;font-size:13px;line-height:1.85}
.dlg .df{padding:18px 34px 24px;border-top:1px solid var(--hair-2);display:flex;gap:10px;justify-content:flex-end;flex:none}
.dlg .fm{padding:0 34px 30px}
.field{margin-top:20px}
.field label{display:block;font-size:10.5px;letter-spacing:.18em;color:var(--ink-3);margin-bottom:8px}
.field input,.field textarea,.field select{width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;
  padding:8px 2px;font:inherit;font-size:13.5px;color:var(--ink);outline:none;border-radius:0}
.field textarea{border:1px solid var(--hair);padding:11px 12px;line-height:1.75;resize:vertical;min-height:92px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field .sub{font-size:10.5px;color:var(--ink-3);letter-spacing:.1em;margin-top:8px;line-height:1.8}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.err{color:var(--danger);font-size:11.5px;letter-spacing:.06em;min-height:17px;margin-top:16px}

/* ---------- Markdown ---------- */
.md h1,.md h2,.md h3,.md h4{font-weight:500;margin:20px 0 10px;line-height:1.5}
.md h1{font-size:16px}.md h2{font-size:15px}.md h3{font-size:14px}.md h4{font-size:13px}
.md p{margin:11px 0}
.md ul,.md ol{margin:11px 0 11px 22px}
.md li{margin:5px 0}
.md code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:rgba(26,26,26,.05);padding:1.5px 5px}
.md pre{background:rgba(26,26,26,.045);border-left:1px solid var(--hair);padding:13px 15px;overflow:auto;margin:13px 0}
.md pre code{background:none;padding:0;font-size:12px;line-height:1.75}
.md blockquote{border-left:1px solid var(--ink);padding:2px 0 2px 15px;margin:13px 0;color:var(--ink-2)}
.md hr{border:0;border-top:1px solid var(--hair);margin:20px 0}
.md table{border-collapse:collapse;margin:14px 0;font-size:12.5px;width:100%}
.md th,.md td{border:1px solid var(--hair);padding:7px 11px;text-align:left}
.md th{background:rgba(26,26,26,.035);font-weight:500}
.md a{color:var(--accent)}
.md strong{font-weight:500}

/* ---------- 登录 ---------- */
.login{position:fixed;inset:0;background:var(--paper);z-index:60;display:none;align-items:center;justify-content:center}
.login.on{display:flex}
.login .box{width:340px;border:1px solid var(--ink);padding:34px 32px}
.login h1{font-size:15px;font-weight:400;letter-spacing:.28em;margin-bottom:6px}
.login .s{font-size:11px;letter-spacing:.16em;color:var(--ink-3);margin-bottom:26px}

.toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:11px 24px;font-size:11.5px;letter-spacing:.16em;z-index:70;opacity:0;transition:opacity .2s var(--ease);pointer-events:none}
.toast.on{opacity:1}
.hide{display:none !important}

/* ---------- 暗色主题（设置页「主题」= 深色 / 跟随系统）----------
   全站配色都走上面这几个变量，所以暗色只需要把变量翻一遍。 */
html[data-theme=dark]{
  --paper:#14140F; --surface:#1C1C18; --ink:#EDEAE3; --ink-2:#A9A49B; --ink-3:#78736B;
  --hair:rgba(237,234,227,.20); --hair-2:rgba(237,234,227,.10);
  --accent:#F07A2E;
}
/**
 * 设置页
 */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:15px 20px;border-bottom:1px solid var(--hair-2)}
.setrow:last-child{border-bottom:0}
.setrow .sn{font-size:13px}
.setrow .sh{margin-top:4px;font-size:11px;color:var(--ink-3);letter-spacing:.03em}
.setrow .sr{flex:0 0 auto;text-align:right}
.setrow select,.setrow input[type=number]{appearance:none;background:var(--surface);color:var(--ink);
  border:1px solid var(--hair);padding:7px 10px;font:inherit;font-size:12px;border-radius:2px;min-width:160px}
/* 下拉框自己的箭头（原生箭头被 appearance:none 去掉了，不补就像只读框） */
.setrow select{background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M2.6 4.6L6 8l3.4-3.4' fill='none' stroke='%239E998F' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:26px;
  background-size:9px 9px}
html[data-theme=dark] .setrow select{background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M2.6 4.6L6 8l3.4-3.4' fill='none' stroke='%2378736B' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-size:9px 9px}
.setrow .kv{font-size:12px;color:var(--ink-2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.sw{position:relative;display:inline-block;width:40px;height:22px;vertical-align:middle}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--hair);border-radius:22px;
  transition:background .18s var(--ease);cursor:pointer}
.sw span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;
  background:var(--surface);border-radius:50%;transition:transform .18s var(--ease)}
.sw input:checked + span{background:var(--accent)}
.sw input:checked + span:before{transform:translateX(18px)}
.setnote{padding:15px 20px 4px;font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.setrow [disabled]{opacity:.5}
/* 设置入口：右上角齿轮（页签栏只放主功能，设置按传统收进图标） */
.topbar .gear{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  margin-left:14px;border-radius:50%;color:var(--ink-3);vertical-align:middle;
  transition:color .18s var(--ease),background .18s var(--ease)}
.topbar .gear:hover{color:var(--ink);background:var(--hair-2)}
.topbar .gear.on{color:var(--accent)}
.topbar .gear svg{display:block}
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <div class="brand" data-i18n="app.name">机 枢</div>
    <div class="sub" data-i18n="app.tagline">MAINSPRING · 待办 / 待拍板 / 验证记录</div>
    <div class="tabs">
      <button class="tab on" data-tab="board" data-i18n="nav.board">看板</button>
      <button class="tab" data-tab="projects" data-i18n="nav.projects">项目文件夹</button>
      <button class="tab" data-tab="events" data-i18n="nav.events">事件流</button>
      <button class="tab" data-tab="tokens" data-i18n="nav.tokens">Token</button>
      <button class="tab" data-tab="agents" data-i18n="nav.agents">唤醒</button>
    </div>
  </div>

  <div class="topbar">
    <span><span class="dot" id="live"></span><span id="live-txt" data-i18n="top.connecting">连接中…</span></span>
    <span></span>
    <span><a id="chpw" data-i18n="top.chpw">改密码</a><span style="margin:0 9px;opacity:.45">·</span><a id="logout" data-i18n="top.logout">退出</a><a id="set-btn" class="gear" data-i18n-title="nav.settings" title="设置"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a></span>
  </div>

  <!-- 看板 -->
  <section id="v-board">
    <div class="stats" id="stats"></div>
    <div class="bar">
      <input class="search" id="q" data-i18n-ph="board.search" placeholder="输编号或关键词检索">
      <button class="btn" id="toggle-closed" data-i18n="board.showClosed">显示已闭环</button>
      <button class="btn" id="reload" data-i18n="btn.refresh">刷 新</button>
      <button class="btn pri" id="add" data-i18n="btn.add">新 建</button>
    </div>
    <div class="cols">
      <div class="col" id="col-decide"></div>
      <div class="col" id="col-verify"></div>
      <div class="col" id="col-todo"></div>
    </div>
  </section>

  <!-- 项目文件夹 -->
  <section id="v-projects" class="hide">
    <div class="bar">
      <div class="k" id="proj-sum" style="flex:1"></div>
      <button class="btn" id="proj-reload" data-i18n="btn.rescan">重 扫</button>
    </div>
    <div class="proj">
      <div class="side" id="proj-side"></div>
      <div class="main" id="proj-main"></div>
    </div>
  </section>

  <!-- 事件流 -->
  <section id="v-events" class="hide">
    <div class="bar">
      <div class="k" id="ev-sum" style="flex:1"></div>
      <button class="btn" id="ev-ack" data-i18n="btn.ackAll">全部标为已读</button>
    </div>
    <div class="panel" id="ev-list"></div>
  </section>

  <!-- Token -->
  <section id="v-tokens" class="hide">
    <div class="bar">
      <div class="k" id="tk-sum" style="flex:1"></div>
      <button class="btn" id="tk-verify" data-i18n="btn.verifyAll">全部自检</button>
      <button class="btn pri" id="tk-add" data-i18n="btn.add">新 建</button>
    </div>
    <div class="tkgrid" id="tk-list"></div>
  </section>

  <!-- 设置 -->

function t(k, vars, fallback){
  var d = I18N[LANG] || {}, z = I18N.zh || {};
  var s = (d[k] != null) ? d[k] : ((z[k] != null) ? z[k] : null);
  if(s == null) s = (fallback != null ? fallback : k);
  if(vars){
    Object.keys(vars).forEach(function(v){ s = s.split('{'+v+'}').join(vars[v]); });
  }
  return s;
}

function applyI18n(root){
  var r = root || document;
  r.querySelectorAll('[data-i18n]').forEach(function(el){
    el.textContent = t(el.getAttribute('data-i18n'), null, el.textContent);
  });
  r.querySelectorAll('[data-i18n-ph]').forEach(function(el){
    el.placeholder = t(el.getAttribute('data-i18n-ph'), null, el.placeholder);
  });
  r.querySelectorAll('[data-i18n-title]').forEach(function(el){
    el.title = t(el.getAttribute('data-i18n-title'), null, el.title);
  });
}

function applyTheme(theme){
  THEME = theme || 'auto';
  try{ localStorage.setItem(LS_THEME, THEME); }catch(e){}
  var real = THEME;
  if(THEME === 'auto'){
    real = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', real);
  var m = document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content', real === 'dark' ? '#14140F' : '#FAF8F4');
}

function setRow(s, v){
  var label = t('settings.' + s.key), hint = t('settings.' + s.key + '.hint');
  if(hint === 'settings.' + s.key + '.hint') hint = '';
  var ctl = '';
  var dis = S.canAdmin ? '' : ' disabled';
  if(s.type === 'enum'){
    ctl = '<select data-set="' + s.key + '"' + dis + '>' + s.choices.map(function(c){
      return '<option value="' + esc(c) + '"' + (String(v) === String(c) ? ' selected' : '') + '>'
        + esc(optLabel(s.key, c)) + '</option>';
    }).join('') + '</select>';
  } else if(s.type === 'int'){
    if(s.choices){
      ctl = '<select data-set="' + s.key + '"' + dis + '>' + s.choices.map(function(c){
        return '<option value="' + esc(c) + '"' + (String(v) === String(c) ? ' selected' : '') + '>'
          + esc(c) + '</option>';
      }).join('') + '</select>';
    } else {
      ctl = '<input type="number" data-set="' + s.key + '"' + dis + ' value="' + esc(v) + '"'
        + ' min="' + (s.min != null ? s.min : 0) + '" max="' + (s.max != null ? s.max : 9999) + '">';
    }
  } else if(s.type === 'bool'){
    ctl = '<label class="sw"><input type="checkbox" data-set="' + s.key + '"' + dis
      + (v === '1' ? ' checked' : '') + '><span></span></label>';
  }
  return '<div class="setrow"><div class="sl"><div class="sn">' + esc(label) + '</div>'
    + (hint ? '<div class="sh">' + esc(hint) + '</div>' : '') + '</div>'
    + '<div class="sr">' + ctl + '</div></div>';
}

function hdr(extra){

function api(path, opt){

  if(opt.body !== undefined && opt.body !== null){

/* ============ 三栏口径（与 v1 的 inBucket 同源：看编号前缀，不看「类型」字段） ============ */
function isClosed(it){ return !!CLOSED[it['状态']]; }
function needsDecide(it){ return !isClosed(it) && (it['类型']==='待拍板' || it['状态']==='待拍板'); }
function bucket(it){
  var c = String(it['编号']||'');
  if(needsDecide(it) && c.indexOf('VF')!==0) return 'decide';
  if(c.indexOf('VF')===0 || it['类型']==='验证记录') return 'verify';
  return 'todo';
}
function decisionCount(){
  return S.items.filter(function(it){return /【拍板 \d{4}-\d{2}-\d{2}】/.test(String(it['备注']||''));}).length;
}
function countIn(b, closed){
  var n=0;
  for(var i=0;i<S.items.length;i++){ if(bucket(S.items[i])===b && isClosed(S.items[i])===!!closed) n++; }
  return n;
}
function itemsIn(b){
  var out;
  if(!S.q){
    /* 🔴 三栏统一：**默认不显示已闭环**（老大 2026-09-20：「已闭环的为什么默认显示？
       不是说最好不显示吗？」）—— 此前「验证记录栏不沉底」的特例已取消。
       怕"看着像空的"这个问题，用每栏底部的「另有 N 条 · 点这里展开」提示解决。 */
    out = S.items.filter(function(it){
      if(bucket(it)!==b) return false;
      return S.showClosed ? true : !isClosed(it);
    });
  } else {
    var q = S.q.toLowerCase();
    out = S.items.filter(function(it){
      if(bucket(it)!==b) return false;
      return (String(it['编号']||'')+String(it['标题']||'')+String(it['备注']||'')).toLowerCase().indexOf(q)>=0;
    });
  }
  out.sort(function(a,b){
    var la=LVORDER.indexOf(a['等级']), lb=LVORDER.indexOf(b['等级']);
    if(la<0)la=9; if(lb<0)lb=9;
    if(la!==lb) return la-lb;
    return String(a['编号']||'').localeCompare(String(b['编号']||''),'zh');
  });
  return out;
}

/* ============ Markdown ============ */
function inline(s){
  s = noEmoji(s);
  return s
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  if(!src) return '<p style="color:var(--ink-3)">'+t('f.noNote')+'</p>';
  var lines = String(src).replace(/\r\n/g,'\n').split('\n');
  var out=[], i=0;
  while(i<lines.length){
    var ln = lines[i];
    if(/^\s*$/.test(ln)){ i++; continue; }
    if(/^```/.test(ln)){
      var code=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');
      continue;
    }
    if(/^(-{3,}|\*{3,})\s*$/.test(ln)){ out.push('<hr>'); i++; continue; }
    var h = ln.match(/^(#{1,4})\s+(.*)$/);
    if(h){ out.push('<h'+h[1].length+'>'+inline(esc(h[2]))+'</h'+h[1].length+'>'); i++; continue; }
    if(/^\s*\|.*\|\s*$/.test(ln) && i+1<lines.length && /^\s*\|[\s:\-|]+\|\s*$/.test(lines[i+1])){
      var head = ln.split('|').slice(1,-1).map(function(x){return x.trim();});
      i += 2;
      var rows=[];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        rows.push(lines[i].split('|').slice(1,-1).map(function(x){return x.trim();})); i++;
      }
      var tb='<table><thead><tr>'+head.map(function(x){return '<th>'+inline(esc(x))+'</th>';}).join('')+'</tr></thead><tbody>';
      rows.forEach(function(r){ tb+='<tr>'+r.map(function(x){return '<td>'+inline(esc(x))+'</td>';}).join('')+'</tr>'; });
      out.push(tb+'</tbody></table>');
      continue;
    }
    if(/^\s*>\s?/.test(ln)){
      var q=[];
      while(i<lines.length && /^\s*>\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      out.push('<blockquote>'+md(q.join('\n'))+'</blockquote>');
      continue;
    }
    if(/^\s*[-*+]\s+/.test(ln)){
      var ul=[];
      while(i<lines.length && /^\s*[-*+]\s+/.test(lines[i])){ ul.push(lines[i].replace(/^\s*[-*+]\s+/,'')); i++; }
      out.push('<ul>'+ul.map(function(x){return '<li>'+inline(esc(x))+'</li>';}).join('')+'</ul>');
      continue;
    }
    if(/^\s*\d+[.)]\s+/.test(ln)){
      var ol=[];
      while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ ol.push(lines[i].replace(/^\s*\d+[.)]\s+/,'')); i++; }
      out.push('<ol>'+ol.map(function(x){return '<li>'+inline(esc(x))+'</li>';}).join('')+'</ol>');
      continue;
    }
    var p=[];
    while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4}\s|```|\s*[-*+]\s|\s*\d+[.)]\s|\s*>|\s*\|)/.test(lines[i])){
      p.push(lines[i]); i++;
    }
    if(p.length) out.push('<p>'+inline(esc(p.join('\n'))).replace(/\n/g,'<br>')+'</p>');
  }
  return out.join('');
}

/* 🔴 隐私防护（老大 2026-09-20：「token 记得做隐私防护，前端不要明文」）——
   列表里**永远只有尾号**，明文只走 /api/tokens/{id}/value 单取一次、直接进剪贴板，不进 DOM。 */
function maskTok(t){
  var tail = t.tail || '';
  var dots = '';
  for(var i=0;i<20;i++) dots += '•';
  return 'ms_' + dots + tail;
}
function renderTokens(){
  var ts = S.tokens||[];
  $('tk-sum').textContent = t('tk.sum', {n: ts.length, ok: ts.filter(function(t){return !t.revoked;}).length});
  $('tk-list').innerHTML = ts.length ? ts.map(function(tk){
    return '<div class="tk'+(tk.revoked?' dead':'')+'">'
      + '<div class="th"><span class="nm">'+esc(tk.name)+'</span>'
      + '<span class="pill k-'+(!tk.revoked?'进行中':'')+'">'+(tk.revoked?t('tk.revoked'):t('tk.active'))+'</span></div>'
      + '<div class="k">'+t('tk.role')+' '+esc(tk.role)+' · '+t('tk.tail')+' '+esc(tk.tail)+'</div>'
      + '<div class="val" id="tkv-'+tk.id+'">'+esc(maskTok(tk))+'</div>'
      + '<div class="ha">'
      + '<button class="btn sm" data-tk="copy" data-id="'+tk.id+'">'+t('tk.copy')+'</button>'
      + '<button class="btn sm" data-tk="verify" data-id="'+tk.id+'">'+t('tk.verify')+'</button>'
      + '<button class="btn sm" data-tk="rotate" data-id="'+tk.id+'">'+t('tk.rotate')+'</button>'
      + '<button class="btn sm gh" data-tk="revoke" data-id="'+tk.id+'" '+(tk.revoked?'disabled':'')+'>'+t('tk.revoke')+'</button>'
      + '</div>'
      + '<div class="st"><span id="tks-'+tk.id+'"></span><span>'+t('tk.created', {ts: esc(tk.created_at||'—')})+'</span>'
      + '<span>'+t('tk.lastUsed', {ts: esc(tk.last_used_at||t('tk.never'))})+'</span></div>'
      + '</div>';
  }).join('') : '<div class="empty">'+t('tk.none')+'</div>';
}
function copyText(t){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(t);
  }
  return new Promise(function(res, rej){            /* http + IP 下 clipboard 不可用，走兜底 */
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); res(); }catch(e){ rej(e); }
    document.body.removeChild(ta);
  });
}
/* 「复制」= 后台单取一次明文 → 直接进剪贴板 → **值不进 DOM** */
function copyTok(tk, btn){
  if(btn) btn.disabled = true;
  api('/api/tokens/'+tk.id+'/value?why='+encodeURIComponent('网页「复制」')).then(function(r){
    return copyText(r.token);
  }).then(function(){
    toast(t('tk.copied', {name: tk.name}));

    $('cp-go').disabled = true;
    api('/api/password', {method:'POST', body:{old:o, user:u, pass:p}})
      .then(function(r){
        closeModal();
        toast(t('cp.done') + (r.changed.length ? r.changed.join(' + ') : t('cp.noChange')));
      })
      .catch(function(e){ $('cp-e').textContent = e.message; $('cp-go').disabled = false; });
  };
}

/* ============ 渲染：唤醒（以 token 为主 + hook 为辅） ============ */
/* 「怎么接」不在页面上写了（老大 2026-09-20 让删）—— 接入指南只活在 `ms_guide.py`：
   出口是 MCP 工具 `ms_guide` 与 REST `GET /api/guide`。**页面只放数据与控件。** */
function agoStr(s){
  if(!s) return t('wk.never');
  var tt = new Date(String(s).replace(' ','T')).getTime();
  if(!tt) return esc(s);
  var d = Math.floor((Date.now()-tt)/1000);
  if(d < 60) return t('ago.now');
  if(d < 3600) return t('ago.min', {n: Math.floor(d/60)});
  if(d < 86400) return t('ago.hour', {n: Math.floor(d/3600)});
  return t('ago.day', {n: Math.floor(d/86400)});
}
function renderWake(){
  var ts = (S.tokens||[]).filter(function(t){ return !t.revoked; });
  var as = S.agents||[];
  var lastId = S.lastEventId || 0;
  var live = 0;

  $('wk-list').innerHTML = ts.length ? ts.map(function(tk){
    var idle = 999999;
    if(tk.last_pull_at){ var tms = new Date(String(tk.last_pull_at).replace(' ','T')).getTime(); idle = tms ? (Date.now()-tms)/1000 : 999999; }
    var on = idle < 180;
    if(on) live++;
    var behind = Math.max(0, lastId - (tk.last_event_id||0));
    var stTxt = !tk.last_pull_at ? t('wk.neverPulled') : (on ? t('wk.online') : t('wk.offline'));
    var stCls = !tk.last_pull_at ? '' : (on ? 'k-进行中' : 'k-已否决');
    return '<div class="row">'
      + '<span class="unread'+(on?'':' no')+'"></span>'
      + '<div class="grow">'
      + '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
      + '<span style="font-size:13.5px">'+esc(tk.name)+'</span>'
      + '<span class="pill k-'+esc(tk.role)+'">'+esc(tk.role)+'</span>'
      + '<span class="pill '+stCls+'">'+stTxt+'</span>'
      + '</div>'
      + '<div class="k" style="margin-top:8px">'
      + t('tk.tail')+' '+esc(tk.tail)
      + ' · '+t('wk.lastPull')+(tk.last_pull_at ? '<b>'+agoStr(tk.last_pull_at)+'</b>（'+esc(tk.last_pull_at)+'）' : '<span style="color:var(--danger)">'+t('wk.never')+'</span>')
      + ' · '+t('wk.cursor')+'<b>#'+(tk.last_event_id||0)+'</b>'+t('wk.latest')+lastId
      + (behind ? ' · <span style="color:var(--accent)">'+t('wk.behind', {n: behind})+'</span>' : ' · <span class="ok">'+t('wk.caughtUp')+'</span>')
      + '</div></div></div>';
  }).join('') : '<div class="empty">'+t('wk.none')+'</div>';

  $('ag-list').innerHTML = as.length ? as.map(function(a){
    var st = a.last_status || '';
    var cls = st.indexOf('ok')===0 ? 'ok' : (st ? 'bad' : '');
    return '<div class="row">'
      + '<div class="grow">'
      + '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
      + '<span class="pill k-'+((a.enabled)?'进行中':'')+'">'+(a.enabled?t('wk.enabled'):t('wk.disabled'))+'</span>'
      + '<span style="font-size:13.5px">'+esc(a.name)+'</span>'
      + (a.note?'<span class="k">'+esc(a.note)+'</span>':'')
      + '</div>'
      + '<div class="mono" style="margin-top:7px;color:var(--ink-2)">'+esc(a.hook_url||t('wk.noHook'))+'</div>'
      + '<div class="k" style="margin-top:7px">'+t('wk.lastPush')+esc(a.last_call_at||t('wk.never'))
      + (st? t('wk.result')+'<span class="'+cls+'">'+esc(st)+'</span>':'')
      + (a.last_error?' · <span class="bad">'+esc(String(a.last_error).slice(0,90))+'</span>':'')
      + '</div></div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">'
      + '<button class="btn sm" data-ag="ping" data-id="'+a.id+'">'+t('wk.ping')+'</button>'
      + '<button class="btn sm" data-ag="toggle" data-id="'+a.id+'">'+(a.enabled?t('wk.disable'):t('wk.enable'))+'</button>'
      + '<button class="btn sm gh" data-ag="del" data-id="'+a.id+'">'+t('wk.del')+'</button>'
      + '</div></div>';
  }).join('') : '<div class="empty">'+t('wk.noAgents')+'</div>';
}
function loadWake(){
  return Promise.all([
    api('/api/tokens').then(function(r){ S.tokens = r.tokens||[]; }),
    api('/api/agents').then(function(r){ S.agents = r.agents||[]; }),
    api('/api/events?limit=1').then(function(r){ S.lastEventId = r.last_id||0; })
  ]).then(function(){ renderWake(); });
}
var loadAgents = loadWake;

function openAgAdd(){
  var body = '<div class="dh"><div class="r1"><span class="pill">'+t('agadd.title')+'</span></div>'
    + '<h2>'+t('agadd.sub')+'</h2></div><div class="rule"></div><div class="fm">'
    + '<div class="field"><label>'+t('agadd.nameLabel')+'</label><input id="ag-n" placeholder="'+t('agadd.namePh')+'"></div>'
    + '<div class="field"><label>'+t('agadd.hookLabel')+'</label><input id="ag-u" placeholder="http://192.168.1.10:9010/wake"></div>'
    + '<div class="field"><label>'+t('agadd.tokenLabel')+'</label><input id="ag-t" placeholder="'+t('agadd.tokenPh')+'"></div>'
    + '<div class="field"><label>'+t('agadd.noteLabel')+'</label><input id="ag-m" placeholder="'+t('agadd.notePh')+'"></div>'
    + '<div class="sub" style="margin-top:16px;font-size:11px;color:var(--ink-3);line-height:1.95">'
    + t('agadd.payload')+'<span class="mono">{event, code, title, opinion, status, project, level, actor, ts, dashboard, howto}</span></div>'
    + '<div class="err" id="ag-e"></div></div>'
    + '<div class="df"><button class="btn gh" id="ag-x">'+t('btn.cancel')+'</button><button class="btn pri" id="ag-go">'+t('btn.create')+'</button></div>';
  modal(body, true);
  $('ag-n').focus();
  $('ag-x').onclick = closeModal;
  $('ag-go').onclick = function(){
    var n = $('ag-n').value.trim();
    if(!n){ $('ag-e').textContent = t('agadd.nameRequired'); return; }
    api('/api/agents',{method:'POST',body:{name:n,hook_url:$('ag-u').value.trim(),
      token:$('ag-t').value.trim(),note:$('ag-m').value.trim()}})
      .then(function(){ closeModal(); loadAgents(); toast(t('agadd.done')); })
      .catch(function(e){ $('ag-e').textContent=e.message; });
  };
}

/* ============ 数据加载 ============ */
function reloadAll(){ return Promise.all([loadItems(), loadEvents(), loadStats()]); }
function loadItems(){
  return api('/api/items').then(function(r){ S.items = r.items||[]; renderBoard(); });
}
function loadStats(){
  return api('/api/stats').then(function(r){
    S.stats = r;
    if(r.build && r.build !== BUILD_ID){
      $('build').innerHTML = '<span class="bad">'+t('msg.newVersion')+'</span>';
    } else {
      $('build').textContent = 'build ' + BUILD_ID;
    }
    renderStats();
  });
}
function loadEvents(){
  return api('/api/events?limit=300').then(function(r){ S.events = r.events||[]; if(S.tab==='events') renderEvents(); });
}
function loadProjects(){
  return api('/api/projects').then(function(r){
    S.projects = r.projects||[]; S.projRoot = r.root; S.projTotal = r.total; renderProjects();
  });
}
function loadTokens(){
  return api('/api/tokens').then(function(r){ S.tokens = r.tokens||[]; renderTokens(); });
}

/* ============ 实时 ============ */
function setLive(on, txt){
  $('live').className = 'dot ' + (on?'live':'dead');
  $('live-txt').textContent = txt;
}
function connectSSE(){
  if(S.sse) try{S.sse.close();}catch(e){}
  var url = API_BASE + '/api/stream' + (tok() ? ('?token='+encodeURIComponent(tok())) : '');
  var es = new EventSource(url, {withCredentials:true});
  S.sse = es;
  es.addEventListener('hello', function(){ setLive(true, t('live.on')); });
  es.addEventListener('changed', function(ev){
    var d = {};
    try{ d = JSON.parse(ev.data); }catch(e){}
    if(d.summary) toast(t('live.changed')+d.summary.slice(0,42));
    reloadAll();
  });
  es.addEventListener('ping', function(){ setLive(true, t('live.on')); });
  es.onerror = function(){
    setLive(false, t('live.down'));
    try{es.close();}catch(e){}
    S.sse = null;
    clearInterval(S.timer);
    S.timer = setInterval(function(){ reloadAll(); }, 30000);
    setTimeout(connectSSE, 8000);
  };
}

/* ============ 事件绑定 ============ */
document.addEventListener('click', function(ev){
  var el0 = ev.target;
  var tab = el0.closest ? el0.closest('.tab') : null;
  if(tab){ switchTab(tab.dataset.tab); return; }
  var card = el0.closest ? el0.closest('[data-detail]') : null;
  if(card){ openDetail(card.dataset.rid); return; }
  var act = el0.closest ? el0.closest('[data-act]') : null;
  if(act){
    var c = act.dataset.code;
    if(act.dataset.act==='mention') openAction(c,'mention');
    else if(act.dataset.act==='decide') openAction(c,'decide');
    else if(act.dataset.act==='close') openClose(c);
    else if(act.dataset.act==='edit') openEdit(c);
    return;
  }
  var pi = el0.closest ? el0.closest('[data-proj]') : null;
  if(pi){ S.projSel = pi.dataset.proj; renderProjects(); return; }
  var mo = el0.closest ? el0.closest('[data-more]') : null;
  if(mo){ setShowClosed(true); return; }
  var fi = el0.closest ? el0.closest('[data-file]') : null;
  if(fi){ openFile(fi.dataset.file); return; }
  var tb = el0.closest ? el0.closest('[data-tk]') : null;
  if(tb){
    var id = +tb.dataset.id;
    var row = (S.tokens||[]).filter(function(x){return x.id===id;})[0];
    if(!row) return;
    if(tb.dataset.tk==='copy'){
      copyTok(row, tb);
    } else if(tb.dataset.tk==='verify'){
      verifyTokById(row, $('tks-'+id), tb);
    } else if(tb.dataset.tk==='rotate'){
      if(!window.confirm(t('tk.rotateAsk'))) return;
      api('/api/tokens/'+id+'/rotate',{method:'POST',body:{}}).then(function(r){
        var tail = r.token.slice(-6);
        return copyText(r.token).then(function(){
          toast(t('tk.rotated', {tail: tail}));
        }).catch(function(){
          toast(t('tk.rotatedNoCopy', {tail: tail}));
        });
      }).then(function(){ loadTokens(); })
        .catch(function(e){ toast(t('msg.failed')+e.message); });
    } else if(tb.dataset.tk==='revoke'){
      if(!window.confirm(t('tk.revokeAsk'))) return;
      api('/api/tokens/'+id+'/revoke',{method:'POST',body:{}}).then(function(){
        loadTokens(); toast(t('tk.revokedMsg'));
      }).catch(function(e){ toast(t('msg.failed')+e.message); });
    }
    return;
  }
  var ag = el0.closest ? el0.closest('[data-ag]') : null;
  if(ag){
    var aid = +ag.dataset.id, aact = ag.dataset.ag;
    var arow = (S.agents||[]).filter(function(x){return x.id===aid;})[0];
    if(!arow) return;
    if(aact==='ping'){
      ag.disabled = true;
      api('/api/agents/'+aid+'/ping',{method:'POST',body:{}}).then(function(r){
        loadAgents();
        toast(r.ok ? (t('wk.pingOk')+r.status) : (t('wk.pingBad')+(r.status||'')+' '+String(r.error||'').slice(0,60)));
      }).catch(function(e){ toast(t('msg.failed')+e.message); });
    } else if(aact==='toggle'){
      api('/api/agents/'+aid,{method:'POST',body:{enabled: !arow.enabled}})
        .then(function(){ loadAgents(); toast(arow.enabled?t('wk.disabledMsg'):t('wk.enabledMsg')); })
        .catch(function(e){ toast(t('msg.failed')+e.message); });
    } else if(aact==='del'){
      if(!window.confirm(t('wk.delAsk'))) return;
      api('/api/agents/'+aid+'/del',{method:'POST',body:{}})
        .then(function(){ loadAgents(); toast(t('msg.deleted')); })
        .catch(function(e){ toast(t('msg.failed')+e.message); });
    }
    return;
  }
});

function switchTab(name){
  S.tab = name;
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===name); });
  ['board','projects','events','tokens','agents','settings'].forEach(function(k){
    $('v-'+k).classList.toggle('hide', k!==name);
  });
  if(name==='projects') loadProjects();
  if(name==='events'){ loadEvents().then(renderEvents); }
  if(name==='tokens') loadTokens();
  if(name==='agents') loadAgents();
  if(name==='settings'){ renderSettings(); if(!SET) loadSettings(); }
  var gear = $('set-btn');
  if(gear) gear.classList.toggle('on', name === 'settings');
}

/* 「显示已闭环」开关 —— 三栏统一默认隐藏，这一个钮管全部 */
function setShowClosed(v){
  S.showClosed = !!v;
  var b = $('toggle-closed');
  if(b){
    b.textContent = S.showClosed ? t('board.hideClosed') : t('board.showClosed');
    b.classList.toggle('pri', S.showClosed);
  }
  renderCols();
}

$('q').addEventListener('input', function(){ S.q = this.value.trim(); renderCols(); });
$('toggle-closed').addEventListener('click', function(){ setShowClosed(!S.showClosed); });
$('reload').addEventListener('click', function(){ reloadAll().then(function(){ toast(t('msg.refreshed')); }); });
$('add').addEventListener('click', openAdd);
$('proj-reload').addEventListener('click', function(){ loadProjects().then(function(){ toast(t('msg.rescanned')); }); });
$('ev-ack').addEventListener('click', function(){
  api('/api/events/ack',{method:'POST',body:{up_to:0}}).then(function(r){
    loadEvents().then(renderEvents); loadStats(); toast(t('msg.acked', {n: r.acked}));
  });
});
$('tk-verify').addEventListener('click', function(){
  api('/api/tokens/verify').then(function(r){
    toast(t('msg.verify', {ok: r.passed, bad: r.failed}));
    return loadTokens();
  }).catch(function(e){ toast(t('msg.failed')+e.message); });
});
$('tk-add').addEventListener('click', openTkAdd);
$('ag-add').addEventListener('click', openAgAdd);
$('chpw').addEventListener('click', openChpw);
$('set-btn').addEventListener('click', function(){ switchTab('settings'); });
$('ag-refresh').addEventListener('click', function(){ loadWake().then(function(){ toast(t('msg.refreshed')); }); });

/* ============ 启动 ============ */
function boot(){
  $('build').textContent = 'build ' + BUILD_ID;
  /* 首屏先用本机缓存的语言/主题上色（避免刷一下白闪），服务端设置拿到后再校准 */
  try{
    var c = localStorage.getItem(LS_LANG);  if(c) LANG = (c === 'en' ? 'en' : 'zh');
    var th = localStorage.getItem(LS_THEME);
    applyTheme(th || 'auto');
    applyLang(WANT_LANG || LANG, false);
  }catch(e){}
  api('/api/whoami').then(function(w){
    S.who = w;
    hideLogin();
    return loadSettings().catch(function(){ /* 设置读不到不挡使用 */ });
  }).then(function(){
    if(WANT_LANG) applyLang(WANT_LANG, false);
    reloadAll().then(function(){
      var tab = WANT_TAB || (S.settings && S.settings.default_tab) || 'board';
      if(tab && tab !== 'board') switchTab(tab);
      if(WANT_OPEN) openDetail(decodeURIComponent(WANT_OPEN));
      if(NO_SSE){
        setLive(true, t('live.poll'));
        S.timer = setInterval(reloadAll, 15000);
      } else {
        setLive(true, t('live.connecting'));
        connectSSE();
      }
    });
  }).catch(function(e){
    if(e.code===401) showLogin();
    else setLive(false, t('live.off'));
  });
}
boot();
</script>
